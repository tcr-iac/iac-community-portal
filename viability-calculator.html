<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Community Viability Calculator</title>
<style>
  :root {
    --navy: #003580;
    --navy-mid: #004a99;
    --border: #c8d8eb;
    --bg: #f0f5fb;
    --text: #1a2b3c;
    --muted: #5a6e85;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Arial, Helvetica, sans-serif; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }

  .page-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    color: #fff; padding: 28px 32px 22px; text-align: center;
  }
  .page-header h1 { font-size: 26px; font-weight: 800; }
  .page-header .subtitle { margin-top: 6px; font-size: 14px; font-style: italic; color: rgba(255,255,255,0.8); }

  #nav-box {
    position: fixed; top: 16px; right: 16px; z-index: 999;
    background: rgba(0,53,128,0.94); border-radius: 10px; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  #nav-box a {
    color: #fff; text-decoration: none; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px; padding: 6px 14px; text-align: center; white-space: nowrap;
  }
  #nav-box a:hover { background: rgba(255,255,255,0.25); }

  .coming-soon-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 24px;
  }
  .coming-soon-card {
    background: #fff; border-radius: 14px; border: 1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,53,128,0.1);
    padding: 48px 44px; max-width: 480px; text-align: center;
  }
  .coming-soon-icon { font-size: 40px; margin-bottom: 16px; }
  .coming-soon-card h2 {
    font-size: 20px; font-weight: 800; color: var(--navy); margin-bottom: 12px;
  }
  .coming-soon-card p {
    font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 24px;
  }
  .back-link {
    display: inline-block; color: #fff; background: var(--navy);
    text-decoration: none; font-size: 13px; font-weight: 700;
    padding: 10px 22px; border-radius: 8px; transition: background 0.15s;
  }
  .back-link:hover { background: var(--navy-mid); }
</style>
</head>
<body>

<div id="nav-box">
  <a id="nav-back-lens" href="#">← Back to the Lens</a>
  <a href="iac_home.html">IAC Home</a>
</div>

<div class="page-header">
  <h1>Community Viability Calculator</h1>
  <div class="subtitle">for the Brainerd Community</div>
</div>

<div class="coming-soon-wrap">
  <div class="coming-soon-card">
    <div class="coming-soon-icon">🛠️</div>
    <h2>Coming Soon</h2>
    <p>The Community Viability Calculator is in final design. Check back soon.</p>
    <a id="back-link" class="back-link" href="#">← Back to the Lens</a>
  </div>
</div>

<script>
// Same scid/zip param passthrough the calculator page already had.
const params = new URLSearchParams(window.location.search);
const scid = params.get('scid') || '9';
const zip  = params.get('zip')  || '56401';

const lensUrl = 'portal.html?scid=' + encodeURIComponent(scid) + '&zip=' + encodeURIComponent(zip);
document.getElementById('nav-back-lens').href = lensUrl;
document.getElementById('back-link').href = lensUrl;
</script>
</body>
</html>
