<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Information Age Community — Introduction</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #003580;
    height: 100vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 28px;
  }
  .brand { font-weight: bold; letter-spacing: 1px; }
  .brand small { display: block; font-weight: normal; font-size: 11px; letter-spacing: 2px; color: #bcd2f0; }
  .org { text-align: right; font-size: 13px; color: #bcd2f0; }

  .stage {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 4px 70px; position: relative;
  }
  .slide-frame {
    display: inline-flex;
    max-width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
    border-radius: 8px; overflow: hidden;
    background: #1665c0;
  }
  .slide-frame img {
    display: block;
    width: auto; height: auto;
    max-width: 1300px;
    max-height: calc(100vh - 180px);
    object-fit: contain;
  }

  .entry-btn {
    text-decoration: none; color: #fff;
    border: 2px solid rgba(255,255,255,0.55); border-radius: 999px;
    padding: 11px 26px; font-size: 15px; font-weight: bold;
    background: rgba(255,255,255,0.08);
  }
  .entry-btn:hover { background: rgba(255,255,255,0.22); }
  .entry-btn.primary { background: #1e88e5; border-color: #1e88e5; }
  .entry-btn.primary:hover { background: #2b96f2; }
</style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:12px;">
      <img src="files/LENS_LOGO_recolored.png" alt="" style="height:38px;" />
      <div class="brand">IAC<small>INFORMATION AGE COMMUNITY</small></div>
    </div>
    <div class="org">Tele-Commuter Resources, Inc.<br>A 501(c)3 Non-Profit Organization</div>
  </header>

  <a href="iac_home.html" class="entry-btn" style="position:fixed; bottom:20px; right:20px; z-index:20; font-size:13px; padding:9px 20px;">&#8592; Back to Home Page</a>

  <div class="stage">
    <div class="slide-frame">
      <img id="slide-img" src="files/IAC_Intro_2026.jpg" alt="The Information Age Community introduction slide">
    </div>
  </div>

</body>
</html>
