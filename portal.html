// ── Global accordion state (only one top-level item open at a time, across all groups) ──
let currentOpenTopLevel = null; // { arrow, childDiv }

// ── Render menu items ───────────────────────────────────────
function renderItem(item, depth) {
  const wrap = document.createElement('div');
  wrap.className = 'menu-item';
  wrap.style.paddingLeft = `${depth * 18}px`;

  const row = document.createElement('div');
  row.className = `menu-row depth-${depth}`;

  if (item.children && item.children.length > 0) {
    const arrow = document.createElement('span');
    arrow.className = 'menu-arrow';
    arrow.textContent = '▶';
    const label = document.createElement('span');
    label.textContent = item.title;
    row.appendChild(arrow);
    row.appendChild(label);

    const childDiv = document.createElement('div');
    childDiv.style.display = 'none';
    item.children.forEach(c => childDiv.appendChild(renderItem(c, depth + 1)));

    let open = false;
    row.addEventListener('click', () => {
      if (depth === 0) {
        // Global accordion: close whatever top-level item is currently open (if different)
        if (currentOpenTopLevel && currentOpenTopLevel.childDiv !== childDiv) {
          currentOpenTopLevel.arrow.style.transform = '';
          currentOpenTopLevel.childDiv.style.display = 'none';
          currentOpenTopLevel.openFlagSetter(false);
        }
        open = !open;
        if (open) {
          currentOpenTopLevel = { arrow, childDiv, openFlagSetter: (v) => { open = v; } };
        } else {
          currentOpenTopLevel = null;
        }
      } else {
        open = !open;
      }
      arrow.style.transform = open ? 'rotate(90deg)' : '';
      childDiv.style.display = open ? 'block' : 'none';
    });

    wrap.appendChild(row);
    wrap.appendChild(childDiv);
  } else if (item.file) {
    row.innerHTML = `<span>📄</span><span style="flex:1">${item.title}</span>`;
    row.addEventListener('click', () => showFileOverlay(item.title, item.file));
    wrap.appendChild(row);
  } else if (item.table) {
    row.innerHTML = `<span>📋</span><span>${item.title}</span>`;
    row.addEventListener('click', () => showTableOverlay(item.title));
    wrap.appendChild(row);
  } else {
    row.innerHTML = `<span style="color:#aaa">•</span><span>${item.title}</span>`;
    wrap.appendChild(row);
  }
  return wrap;
}

function showFileOverlay(title, fileName) {
  const overlay = document.getElementById('table-overlay');
  document.getElementById('table-overlay-title').textContent = title;
  document.querySelector('#table-overlay-box table').style.display = 'none';
  let msgBox = document.getElementById('file-coming-soon');
  if (!msgBox) {
    msgBox = document.createElement('div');
    msgBox.id = 'file-coming-soon';
    msgBox.style.cssText = 'padding:10px;text-align:center;color:#888;';
    document.getElementById('table-overlay-box').appendChild(msgBox);
  }

  const filePath = `files/${fileName}`;
  const ext = fileName.split('.').pop().toLowerCase();

  fetch(filePath, { method: 'HEAD' })
    .then(res => {
      if (res.ok) {
        if (ext === 'pdf') {
          window.open(filePath, '_blank');
          return;
        } else if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
          msgBox.innerHTML = `<img src="${filePath}" style="max-width:100%;max-height:65vh;border-radius:6px;">`;
        } else if (['ppt','pptx','doc','docx','xls','xlsx'].includes(ext)) {
          msgBox.innerHTML = `
            <div style="padding:30px;">
              <div style="font-size:40px;margin-bottom:12px;">📄</div>
              <p style="font-size:15px;color:#444;margin-bottom:12px;"><strong>${fileName}</strong></p>
              <a href="${filePath}" download style="background:#004a99;color:white;padding:10px 24px;border-radius:6px;text-decoration:none;font-weight:600;">Download File</a>
            </div>`;
        } else {
          msgBox.innerHTML = `<a href="${filePath}" target="_blank">Open ${fileName}</a>`;
        }
        msgBox.style.display = 'block';
        overlay.hidden = false;
      } else {
        showComingSoon();
      }
    })
    .catch(() => showComingSoon());

  function showComingSoon() {
    msgBox.innerHTML = `
      <div style="padding:30px;">
        <div style="font-size:40px;margin-bottom:12px;">📄</div>
        <p style="font-size:15px;color:#444;margin-bottom:6px;"><strong>${fileName}</strong></p>
        <p style="font-size:13px;color:#aaa;">This file is not loaded yet — coming soon!</p>
      </div>`;
    msgBox.style.display = 'block';
    overlay.hidden = false;
  }
}

function showTableOverlay(title) {
  const msgBox = document.getElementById('file-coming-soon');
  if (msgBox) msgBox.style.display = 'none';
  const table = document.querySelector('#table-overlay-box table');
  table.style.display = '';
  table.querySelector('thead tr').innerHTML = '<th>Name</th><th>Phone</th><th>Address</th><th>Website</th><th>Map</th>';
  document.getElementById('table-overlay-title').textContent = title;
  const tbody = document.getElementById('table-overlay-body');
  tbody.innerHTML = '';
  const scData = RESTAURANT_DATA[scid] || RESTAURANT_DATA['102'];
  const rows = scData[title] || [];
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:30px;">📋 No listings yet for this category — coming soon!</td></tr>';
  } else {
    rows.forEach(r => {
      tbody.innerHTML += `<tr>
        <td>${r.name}</td>
        <td>${r.phone}</td>
        <td>${r.address}</td>
        <td><a href="${r.website}" target="_blank">Visit</a></td>
        <td><a href="${r.map}" target="_blank">Map</a></td>
      </tr>`;
    });
  }
  document.getElementById('table-overlay').hidden = false;
}
