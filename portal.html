    #zone-navbar {
      position: sticky; top: 0; z-index: 100;
      background: #004a99;
      display: flex; align-items: center; gap: 1rem;
      padding: 0.7rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #nav-back-link {

      font-weight: 600; white-space: nowrap;
      transition: color 0.15s;
    }
    #nav-back-link:hover { color: #fff; }
    #nav-portal-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
      white-space: nowrap;
    }
    #nav-center-title {
      flex: 1; text-align: center; font-size: 1rem;
      font-weight: 700; color: #fff; letter-spacing: 0.02em;
    }
    #nav-search {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 0.4rem; color: #fff; font-size: 0.85rem;
      font-family: inherit; padding: 0.4rem 0.8rem; outline: none; width: 200px;
    }
    #nav-search::placeholder { color: rgba(255,255,255,0.5); }

    /* ZONE 2 — HEADER */
    #zone-header {
      background: linear-gradient(135deg, #003580 0%, #004a99 60%, #0066cc 100%);
      color: #fff;
      display: flex; align-items: flex-start; gap: 2rem;
      padding: 2rem 2.5rem;
    }
    #header-text { flex: 1; }
    #header-sc-name { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.3rem; }
    #header-tagline2 { font-size: 0.95rem; color: rgba(255,255,255,0.75); margin-bottom: 0.2rem; }

    #header-vision1, #header-vision2 {

      color: rgba(255,255,255,0.72); line-height: 1.6;
      border-left: 3px solid rgba(255,255,255,0.3);

      padding: 2px 10px; font-size: 11px;
      cursor: pointer; margin-left: auto;
    }

</head>

// ── Render menu items ───────────────────────────────────────
function renderItem(item, depth) {
  const wrap = document.createElement('div');
  wrap.className = 'menu-item';
  wrap.style.paddingLeft = `${depth * 18}px`;

  const row = document.createElement('div');
  row.className = 'menu-row';
  row.style.borderLeft = `3px solid ${depth === 0 ? '#004a99' : depth === 1 ? '#0066cc' : '#aaa'}`;
  row.style.fontWeight = depth === 0 ? '700' : '400';
  row.style.fontSize = `${14 - depth}px`;
  row.style.background = depth === 0 ? '#f0f6ff' : 'white';

  if (item.children && item.children.length > 0) {
    const arrow = document.createElement('span');
    arrow.className = 'menu-arrow';
    arrow.textContent = '▶';
    const label = document.createElement('span');
    label.textContent = item.title;
    row.appendChild(arrow);
    row.appendChild(label);

    const childDiv = document.createElement('div');
    childDiv.style.display = 'none';
    item.children.forEach(c => childDiv.appendChild(renderItem(c, depth + 1)));

    let open = false;
    row.addEventListener('click', () => {
      open = !open;
      arrow.style.transform = open ? 'rotate(90deg)' : '';
      childDiv.style.display = open ? 'block' : 'none';
    });

    wrap.appendChild(row);
    wrap.appendChild(childDiv);
  } else if (item.file) {
    row.innerHTML = `<span>📄</span><span style="flex:1">${item.title}</span>`;
    const btn = document.createElement('button');
    btn.className = 'menu-load-btn';
    btn.textContent = 'Load';
    btn.addEventListener('click', e => { e.stopPropagation(); showFileOverlay(item.title, item.file); });
    row.appendChild(btn);
    wrap.appendChild(row);
  } else if (item.table) {
    row.innerHTML = `<span>📋</span><span>${item.title}</span>`;
    row.addEventListener('click', () => showTableOverlay(item.title));
    wrap.appendChild(row);
  } else {
    row.innerHTML = `<span style="color:#aaa">•</span><span>${item.title}</span>`;
    wrap.appendChild(row);
  }
  return wrap;
}

function showFileOverlay(title, fileName) {
  const overlay = document.getElementById('table-overlay');
  document.getElementById('table-overlay-title').textContent = title;
  document.querySelector('#table-overlay-box table').style.display = 'none';
  let msgBox = document.getElementById('file-coming-soon');
  if (!msgBox) {
    msgBox = document.createElement('div');
    msgBox.id = 'file-coming-soon';
    msgBox.style.cssText = 'padding:10px;text-align:center;color:#888;';
    document.getElementById('table-overlay-box').appendChild(msgBox);
  }

  const filePath = `files/${fileName}`;
  const ext = fileName.split('.').pop().toLowerCase();

  // Try to load the actual file - check if it exists
  fetch(filePath, { method: 'HEAD' })
    .then(res => {
      if (res.ok) {
        // File exists - display it
        if (ext === 'pdf') {
          msgBox.innerHTML = `<iframe src="${filePath}" style="width:100%;height:65vh;border:1px solid #eee;border-radius:6px;"></iframe>`;
        } else if (['jpg','jpeg','png','gif','webp'].includes(ext)) {
          msgBox.innerHTML = `<img src="${filePath}" style="max-width:100%;max-height:65vh;border-radius:6px;">`;
        } else if (['ppt','pptx','doc','docx','xls','xlsx'].includes(ext)) {
          msgBox.innerHTML = `
            <div style="padding:30px;">
              <div style="font-size:40px;margin-bottom:12px;">📄</div>
              <p style="font-size:15px;color:#444;margin-bottom:12px;"><strong>${fileName}</strong></p>
              <a href="${filePath}" download style="background:#004a99;color:white;padding:10px 24px;border-radius:6px;text-decoration:none;font-weight:600;">Download File</a>
            </div>`;
        } else {
          msgBox.innerHTML = `<a href="${filePath}" target="_blank">Open ${fileName}</a>`;
        }
      } else {
        showComingSoon();
      }
    })
    .catch(() => showComingSoon());

  function showComingSoon() {
    msgBox.innerHTML = `
      <div style="padding:30px;">
        <div style="font-size:40px;margin-bottom:12px;">📄</div>
        <p style="font-size:15px;color:#444;margin-bottom:6px;"><strong>${fileName}</strong></p>
        <p style="font-size:13px;color:#aaa;">This file is not loaded yet — coming soon!</p>
      </div>`;
  }

  msgBox.style.display = 'block';
  overlay.hidden = false;
}

  document.getElementById('table-overlay').hidden = false;
}

document.getElementById('table-overlay-close').addEventListener('click', () => {
  document.getElementById('table-overlay').hidden = true;
});
document.getElementById('table-overlay-backdrop').addEventListener('click', () => {
  document.getElementById('table-overlay').hidden = true;
});

function loadMenu(idx) {
  const content = document.getElementById('menu-content');
  content.innerHTML = '';
  const items = MENUS[idx] || [];
  items.forEach(item => content.appendChild(renderItem(item, 0)));
}

// ── Init ────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const scid = params.get('scid') || '102';
const zip  = params.get('zip')  || '';
const sc   = SC_DATA[scid] || SC_DATA['102'];

document.getElementById('header-sc-name').textContent  = sc.name;
document.getElementById('header-tagline2').textContent = sc.tagline2;
document.getElementById('header-iac-line').textContent = sc.iacLine;
document.getElementById('header-vision1').textContent  = sc.vision1;
document.getElementById('header-vision2').textContent  = sc.vision2;
document.getElementById('tagline-text').textContent    = sc.tagline;
document.getElementById('nav-center-title').textContent = sc.name;

// Menu tabs
const btn1 = document.getElementById('menu-btn-1');
const btn2 = document.getElementById('menu-btn-2');
const btn3 = document.getElementById('menu-btn-3');
[btn1, btn2, btn3].forEach((btn, i) => {
  btn.addEventListener('click', () => {
    [btn1, btn2, btn3].forEach(b => b.setAttribute('aria-selected', 'false'));
    btn.setAttribute('aria-selected', 'true');
    loadMenu(i + 1);
  });
});
btn1.setAttribute('aria-selected', 'true');
loadMenu(1);

// Video
const thumb = document.getElementById('video-thumb');
const modal  = document.getElementById('video-modal');
const player = document.getElementById('video-player');
thumb.addEventListener('click', () => {
  window.open(sc.videoUrl, '_blank');
});
document.getElementById('video-modal-close').addEventListener('click', () => {
  modal.hidden = true; player.pause(); player.src = '';
});
document.getElementById('video-modal-backdrop').addEventListener('click', () => {
  modal.hidden = true; player.pause(); player.src = '';
});

// Bottom nav
document.getElementById('btn-iac-lens').addEventListener('click', () => { window.location.href = 'index.html'; });
document.getElementById('btn-neighborhoods').addEventListener('click', () => { window.location.href = `profile.html?scid=${scid}&zip=${zip}`; });
document.getElementById('btn-contacts').addEventListener('click', () => { alert('Contacts coming soon!'); });
document.getElementById('btn-receptionists').addEventListener('click', () => { alert('Community Receptionists coming soon!'); });
</script>
</body>
