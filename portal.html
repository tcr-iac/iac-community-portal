  <style>

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    html{background:#f4f6fb}

    body{font-family:"Inter",Arial,sans-serif;background:#f4f6fb;color:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;overflow:auto}

    #zone-footer{background:#003580;color:rgba(255,255,255,0.7);text-align:center;padding:0.3rem 1rem;font-size:0.8rem;font-weight:500;border-top:1px solid rgba(255,255,255,0.1);flex-shrink:0;position:sticky;bottom:0;z-index:99}

    #zone-footer a{color:#8fc1ff;text-decoration:none}

    #zone-footer a:hover{text-decoration:underline}

    #zone-header{background:linear-gradient(135deg,#003580 0%,#004a99 60%,#0066cc 100%);color:#fff;display:flex;align-items:flex-start;gap:2.6rem;padding:0.6rem 1.5rem;flex-shrink:0}

    #header-text{flex:1}

    #header-sc-name{font-size:1.3rem;font-weight:800;margin-bottom:0.3rem;color:#fff}

    #header-tagline2{font-size:0.82rem;color:rgba(255,255,255,0.75);margin-bottom:0.2rem}

    #header-iac-line{font-size:0.75rem;color:rgba(255,255,255,0.55);margin-bottom:0.5rem;letter-spacing:0.05em;text-transform:uppercase}

    #header-vision1,#header-vision2{font-size:0.78rem;font-style:italic;color:rgba(255,255,255,0.85);line-height:1.5;border-left:3px solid #2e7d4f;padding-left:0.75rem;margin-bottom:0.2rem}

    #video-thumb-wrapper{flex-shrink:0;text-align:center}

    #video-thumb{width:140px;height:84px;background:rgba(0,0,0,0.4);border-radius:0.5rem;border:2px solid rgba(255,255,255,0.2);cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:border-color 0.2s}

    #video-thumb:hover{border-color:rgba(255,255,255,0.6)}

    #video-poster{position:absolute;top:0;left:0;width:100%;height:100%;background:url('https://img.youtube.com/vi/Gdl_vfZPQoQ/hqdefault.jpg') center/cover}

    #video-play-btn{position:relative;z-index:2;font-size:2.5rem;color:white;text-shadow:0 2px 8px rgba(0,0,0,0.8)}

    #video-caption{font-size:0.75rem;color:rgba(255,255,255,0.6);margin-top:0.4rem}

    #zone-tagline{background:#003580;color:rgba(255,255,255,0.85);text-align:center;padding:0.2rem 1rem;font-size:0.82rem;font-weight:600;letter-spacing:0.05em;flex-shrink:0}

    #zone-menus{padding:0.4rem 1.5rem;display:flex;gap:1rem;align-items:stretch;flex:1;min-height:300px;overflow-y:auto}

    .menu-group{flex:1;min-width:0;display:flex;flex-direction:column}

    @media(max-width:1100px){
  #zone-menus{padding:0.4rem 0.5rem;gap:0.5rem}
}
@media(max-width:900px){
  #zone-menus{flex-direction:column;height:auto;overflow-y:auto;min-height:unset}
  .menu-group{min-height:150px;max-height:none;flex:none}
  body{overflow:auto;min-height:100vh}
  #zone-app-demos{flex-wrap:wrap;gap:0.4rem}
  .app-demo-btn{font-size:0.8rem;padding:0.4rem 0.8rem}
}
@media(max-width:600px){
  #zone-header{flex-direction:column;gap:0.5rem}
  #video-thumb-wrapper{align-self:flex-start}
  .app-demo-btn{font-size:0.75rem;padding:0.4rem 0.8rem}
}

    .menu-group-title{font-size:1rem;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:#004a99;padding-bottom:0.4rem;margin-bottom:0.5rem;border-bottom:3px solid #2e7d4f;flex-shrink:0;text-align:center}

    .menu-group-content{background:white;border-radius:0.6rem;border:1px solid #e0e8f5;padding:0.5rem;box-shadow:0 2px 10px rgba(0,74,153,0.06);flex:1;overflow-y:auto;overflow-x:hidden}

    #zone-app-demos{padding:0.4rem 1.5rem;display:flex;align-items:center;justify-content:center;gap:1rem;background:#e6f4ec;border-top:1px solid #cce6d6;border-bottom:1px solid #cce6d6;flex-wrap:wrap;flex-shrink:0;position:sticky;bottom:0;z-index:100}

    #app-demos-label{font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#555}

    .app-demo-btn{background:#2e7d4f;color:#fff;border:none;border-radius:0.5rem;padding:0.5rem 1.25rem;font-size:0.85rem;font-family:inherit;font-weight:700;cursor:pointer;transition:all 0.15s;box-shadow:0 2px 8px rgba(46,125,79,0.3)}

    .app-demo-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(46,125,79,0.4);opacity:0.9}

    .app-demo-btn.disabled{background:#888;cursor:not-allowed;opacity:0.7}

    #video-modal{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999}

    #video-modal[hidden]{display:none}

    #video-modal-backdrop{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92)}

    #video-modal-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;height:95vh;max-width:1600px;display:flex;flex-direction:column}

    #video-modal-toolbar{flex-shrink:0;display:flex;justify-content:flex-end;padding-bottom:10px}

    #video-modal-close{background:#004a99;color:#fff;border:none;border-radius:20px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;z-index:10001;letter-spacing:0.02em;box-shadow:0 2px 8px rgba(0,0,0,0.5)}

    #video-player-frame{flex:1;min-height:0;border:0;border-radius:0.5rem;display:block}

    #table-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;display:flex;align-items:center;justify-content:center}

    #table-overlay[hidden]{display:none}

    #table-overlay-backdrop{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6)}

    #table-overlay-box{position:relative;background:white;border-radius:8px;padding:24px;width:95%;max-width:1200px;max-height:92vh;overflow-y:auto}

    #table-overlay-box h3{color:#004a99;margin-bottom:16px;font-size:16px;padding-right:160px}

    #table-overlay-close{position:absolute;top:16px;right:16px;background:#004a99;color:#fff;border:none;border-radius:20px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.35);letter-spacing:0.02em}

    .biz-table{width:100%;border-collapse:collapse;font-size:12px}

    .biz-table th{background:#004a99;color:white;padding:8px 10px;text-align:left}

    .biz-table td{padding:8px 10px;border-bottom:1px solid #eee;vertical-align:top}

    .biz-table tr:nth-child(even){background:#f7f9fc}

    .biz-table a{color:#004a99;text-decoration:none;font-weight:600}

    .biz-table a:hover{text-decoration:underline}

    .zip-filter{margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

    .zip-filter label{font-size:12px;font-weight:600;color:#555}

    .zip-filter input{padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:12px;width:120px}

    /* ── Community Concerns Form ─────────────────────────────────────────────
       Rendered inside the shared #table-overlay modal by showConcernsForm().
       Colors/radii intentionally match the portal palette:
       #003580/#004a99 (blue), #2e7d4f (green accent), Inter font.        */
    .cc-form{font-size:13px}

    .cc-fieldset{border:1px solid #e0e8f5;border-radius:0.6rem;padding:14px 16px 16px;margin-bottom:16px}

    .cc-fieldset legend{font-size:0.8rem;font-weight:800;text-transform:uppercase;letter-spacing:0.12em;color:#004a99;padding:0 8px}

    .cc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

    .cc-field{display:flex;flex-direction:column;gap:5px}

    .cc-field.cc-full{grid-column:1/-1}

    .cc-field label{font-size:12px;font-weight:600;color:#555}

    .cc-req{color:#b3261e;margin-left:2px}

    .cc-field input,.cc-field select,.cc-field textarea{font-family:inherit;font-size:13px;color:#1a1a2e;padding:8px 10px;border:1px solid #ccd6e5;border-radius:0.4rem;background:#fff;width:100%}

    .cc-field textarea{resize:vertical;min-height:76px}

    .cc-field input:focus,.cc-field select:focus,.cc-field textarea:focus{outline:none;border-color:#004a99;box-shadow:0 0 0 2px rgba(0,74,153,0.15)}

    .cc-field select:disabled{background:#f4f6fb;color:#999;cursor:not-allowed}

    .cc-field .cc-hint{font-size:11px;color:#888}

    .cc-error{font-size:11px;font-weight:600;color:#b3261e;display:none}

    .cc-field.cc-invalid input,.cc-field.cc-invalid select,.cc-field.cc-invalid textarea{border-color:#b3261e}

    .cc-field.cc-invalid .cc-error{display:block}

    .cc-filelist{font-size:11px;color:#555;margin-top:2px}

    .cc-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center}

    .cc-btn{border:none;border-radius:0.5rem;padding:0.55rem 1.4rem;font-family:inherit;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.15s}

    .cc-btn-primary{background:#2e7d4f;color:#fff;box-shadow:0 2px 8px rgba(46,125,79,0.3)}

    .cc-btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(46,125,79,0.4);opacity:0.9}

    .cc-btn-secondary{background:#eef2f9;color:#004a99}

    .cc-btn-secondary:hover{background:#e2eaf5}

    .cc-success{background:#e6f4ec;border:1px solid #cce6d6;color:#2e7d4f;border-radius:0.5rem;padding:14px 16px;font-weight:600}

    .menu-item{margin-bottom:0}

    .menu-row{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;border-radius:4px;transition:background 0.15s}

    .menu-row:hover{background:#e8f0fe}

    .menu-arrow{font-size:9px;color:#2e7d4f;transition:transform 0.2s}

    .menu-row.depth-0{text-transform:uppercase;font-weight:800;font-size:13px;background:#f0f6ff;border-left:4px solid #2e7d4f;padding:4px 6px}

    .menu-row.depth-1{font-weight:600;font-size:12px;border-left:3px solid #0066cc;padding:3px 6px;margin-left:0}

    .menu-row.depth-2,.menu-row.depth-3{font-weight:400;font-size:12px;border-left:2px solid #ccc;padding:2px 4px}

    .coming-soon-box{padding:30px;text-align:center}

    .coming-soon-box .icon{font-size:40px;margin-bottom:12px}

    .coming-soon-box p{font-size:13px;color:#aaa;margin-top:6px}

    .coming-soon-box strong{font-size:15px;color:#444;display:block;margin-bottom:4px}

  </style>

// ─── ZIP filter helpers ───────────────────────────────────────────────────────

function getZipsForSCID(scid){

  var z=SC_ZIPS[String(scid)];

  return z?z:[];

}

// ─── File/image overlay ───────────────────────────────────────────────────────

function showFileOverlay(title,filename){

  var overlay=document.getElementById('table-overlay');

  var titleEl=document.getElementById('table-overlay-title');

  var inner=document.getElementById('overlay-inner-content');

  titleEl.textContent=title;

  var ext=filename.split('.').pop().toLowerCase();

  var url='files/'+filename;

  if(ext==='jpg'||ext==='jpeg'||ext==='png'||ext==='gif'){

    inner.innerHTML='<img src="'+url+'" style="max-width:100%;border-radius:6px;" />';

  } else if(ext==='pdf'){

    inner.innerHTML='<iframe src="'+url+'" style="width:100%;height:70vh;border:none;border-radius:6px;"></iframe>';

  } else if(ext==='xlsx'||ext==='csv'){

    inner.innerHTML='<p style="padding:20px;color:#555;">Download: <a href="'+url+'" download style="color:#004a99;font-weight:700;">'+filename+'</a></p>';

  } else {

    inner.innerHTML='<p style="padding:20px;color:#555;"><a href="'+url+'" target="_blank" style="color:#004a99;font-weight:700;">Open '+filename+'</a></p>';

  }

  overlay.hidden=false;

}

// ─── Directory table ──────────────────────────────────────────────────────────

function showDirectoryTable(category,scid,zip){

  var rows=NAICS_DATA[category]||[];

  var zips=getZipsForSCID(scid);

  // Filter by ZIP if we have zip data for this SC

  var filtered=rows;

  if(zips.length>0){

    filtered=rows.filter(function(r){return zips.indexOf(r[3])>=0;});

  }

  var overlay=document.getElementById('table-overlay');

  var titleEl=document.getElementById('table-overlay-title');

  var inner=document.getElementById('overlay-inner-content');

  titleEl.textContent=category;

  if(filtered.length===0){

    inner.innerHTML='<p style="padding:20px;color:#888;">No listings found for this category.</p>';

  } else {

    var html='<div class="zip-filter"><label>Filter by ZIP:</label><input id="zip-input" type="text" placeholder="e.g. 56401" oninput="filterTable(this.value)" /></div>';

    html+='<table class="biz-table" id="biz-tbl"><thead><tr><th>#</th><th>Business</th><th>Address</th><th>ZIP</th><th>Map</th></tr></thead><tbody>';

    for(var i=0;i<filtered.length;i++){

      var r=filtered[i];

      var name=r[0]||'';

      var addr=r[1]||'';

      var url=r[2]||'';

      var z=r[3]||'';

      var nameCell=url?'<a href="'+url+'" target="_blank">'+escapeHtml(name)+'</a>':escapeHtml(name);

      var mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);

      html+='<tr data-zip="'+z+'"><td>'+(i+1)+'</td><td>'+nameCell+'</td><td>'+escapeHtml(addr)+'</td><td>'+z+'</td><td><a href="'+mapUrl+'" target="_blank" title="View on Google Maps">📍</a></td></tr>';

    }

    html+='</tbody></table>';

    inner.innerHTML=html;

  }

  overlay.hidden=false;

}

function filterTable(val){

  var rows=document.querySelectorAll('#biz-tbl tbody tr');

  for(var i=0;i<rows.length;i++){

    var z=rows[i].getAttribute('data-zip')||'';

    rows[i].style.display=(!val||z.indexOf(val)>=0)?'':'none';

  }

}

        dropdown then shows "No specific topics — describe below" and is not
        required.

   2) CONCERN_STATUSES — "Current Status" dropdown. Add/remove/reorder strings.

   Note: labels are used verbatim as both the option text and the submitted
   value, so changing a label changes the stored value too.

function ccSetError(fieldId,on){
  var el=document.getElementById(fieldId);
  if(el) el.className='cc-field'+(el.className.indexOf('cc-full')>=0?' cc-full':'')+(on?' cc-invalid':'');
}
function ccClearError(fieldId){ ccSetError(fieldId,false); }

// Validates every field except Attach Files, which is optional.
function ccSubmit(e){
  e.preventDefault();
  var v=function(id){return (document.getElementById(id).value||'').trim();};
  var ok=true;
  var checks=[
    ['cc-f-name',  v('cc-name').length>0],
    ['cc-f-phone', v('cc-phone').replace(/\D/g,'').length>=10],
    ['cc-f-email', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('cc-email'))],
    ['cc-f-area',  v('cc-area').length>0],
    // Topic is required only when the selected area actually defines topics.
    ['cc-f-topic', document.getElementById('cc-topic').disabled||v('cc-topic').length>0],
    ['cc-f-status',v('cc-status').length>0],
    ['cc-f-desc',  v('cc-desc').length>0]
  ];
  for(var i=0;i<checks.length;i++){
    ccSetError(checks[i][0],!checks[i][1]);
    if(!checks[i][1]) ok=false;
  }
  if(!ok) return;

  var files=document.getElementById('cc-files').files;
  var fileNames=[];
  for(var j=0;j<files.length;j++) fileNames.push(files[j].name);

  // No backend yet — the submission is logged and confirmed on screen.
  // To wire this up, POST `submission` (and the File objects above, via
  // FormData) to your endpoint here.
  var submission={
    name:v('cc-name'), phone:v('cc-phone'), email:v('cc-email'),
    area:v('cc-area'), topic:v('cc-topic'), status:v('cc-status'),
    description:v('cc-desc'), attachments:fileNames
  };
  console.log('Community Concern submitted:',submission);

  document.getElementById('overlay-inner-content').innerHTML=
    '<div class="cc-success">Thank you, '+escapeHtml(submission.name)+'. Your concern regarding '+
    escapeHtml(submission.area)+(submission.topic?' — '+escapeHtml(submission.topic):'')+
    ' has been recorded. A community coordinator will follow up at '+escapeHtml(submission.email)+'.</div>';
}

function escapeHtml(s){

  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

}

// ─── Menu rendering ───────────────────────────────────────────────────────────

function buildMenuHTML(items,depth,scid,zip){

  if(!items||items.length===0) return '';

  // Sort items alphabetically at each level
  items = items.slice().sort(function(a,b){return (a.title||a.label||'').localeCompare(b.title||b.label||'')}); 

  var html='';

  for(var i=0;i<items.length;i++){

    var item=items[i];

    var hasChildren=item.children&&item.children.length>0;

    // Mark empty top-level items as placeholders (greyed out, not clickable)
    var isPlaceholder=(depth===0&&!hasChildren);

    var isLeaf=!hasChildren;

    var isTableLeaf=isLeaf&&item.table;

    var rowId='menu-row-'+Math.random().toString(36).substr(2,9);

    var childId='menu-children-'+Math.random().toString(36).substr(2,9);

    var arrow=hasChildren?'<span class="menu-arrow" id="arr-'+rowId+'">&#9654;</span>':'<span style="width:14px;display:inline-block;"></span>';

    var clickAttr='';

    if(isTableLeaf){

      clickAttr=' onclick="showDirectoryTable(\''+escapeHtml(item.title).replace(/'/g,"\\'")+'\',' +scid+',\''+zip+'\')"';

    } else if(item.onclick){

      clickAttr=' onclick="'+escapeHtml(item.onclick)+'"';

    } else if(item.file){

      var ext=(item.file.split('.').pop()||'').toLowerCase();

      var label=item.title;

      clickAttr=' onclick="showFileOverlay(\''+escapeHtml(label).replace(/'/g,"\\'")+'\',' +'\''+item.file+'\')"';

    } else if(hasChildren){

      clickAttr=' onclick="toggleMenu(\''+childId+'\',\'arr-'+rowId+'\')"';

    }

    html+='<div class="menu-item">';

    var extraClass=(depth===0&&!hasChildren)?' style="color:#aaa;cursor:default;font-style:italic"':'';html+='<div class="menu-row depth-'+depth+'"'+clickAttr+extraClass+'>'+arrow+'<span>'+escapeHtml(item.title)+'</span></div>';

    if(hasChildren){

      html+='<div id="'+childId+'" style="display:none;padding-left:'+(depth<2?12:8)+'px;">'+buildMenuHTML(item.children,depth+1,scid,zip)+'</div>';

    }

    html+='</div>';

  }

  return html;

}
function toggleMenu(childId,arrId){
  var el=document.getElementById(childId);
  var arr=document.getElementById(arrId);
  if(!el) return;
  var opening=el.style.display==='none'||el.style.display==='';

  if(opening){
    // Only close top-level items in the 3 menu columns, not nested parents
    var topLevel=document.querySelectorAll('#menu-content-1>[id^="menu-"], #menu-content-2>[id^="menu-"], #menu-content-3>[id^="menu-"]');
    // Simpler approach: find all depth-0 children containers only
    var allOpen=document.querySelectorAll('[id^="menu-children-"]');
    for(var i=0;i<allOpen.length;i++){
      var candidate=allOpen[i];
      if(candidate.id===childId) continue;
      // Only close it if the one being opened is NOT nested inside it
      if(candidate.contains(el)) continue;
      if(candidate.style.display!=='none'){
        candidate.style.display='none';
        var sibArrId=candidate.id.replace('menu-children-','arr-');
        var sibArr=document.getElementById(sibArrId);
        if(sibArr) sibArr.style.transform='';
      }
    }
  }

  el.style.display=opening?'block':'none';
  if(arr) arr.style.transform=opening?'rotate(90deg)':'';

  if(opening){
    setTimeout(function(){
      el.previousElementSibling&&el.previousElementSibling.scrollIntoView({block:'nearest',behavior:'smooth'});
    },50);
  }
}

}

function createYTPlayer(videoId){
  if(ytPlayer){
    try{ytPlayer.destroy();}catch(e){}
    ytPlayer=null;
  }
  document.getElementById('video-player-frame').innerHTML='';
  document.getElementById('video-player-frame').style.visibility='';
  ytPlayer=new YT.Player('video-player-frame',{
    height:'100%',
    width:'100%',
    videoId:videoId,
    playerVars:{autoplay:1,rel:0,modestbranding:1,volume:30},
    events:{
      onReady:function(e){
        try{e.target.setVolume(30);}catch(ex){}
      },
      onStateChange:function(e){
        // YT.PlayerState.ENDED = 0
        if(e.data===YT.PlayerState.ENDED){
          var frame=document.getElementById('video-player-frame');
          if(frame) frame.style.visibility='hidden';
          closeVideo();
        }
      },
      onError:function(){
        // If player errors, fall back to timer close
        if(videoTimer) clearTimeout(videoTimer);
        videoTimer=setTimeout(closeVideo,210000);
      }
    }
  });
}

// Load YouTube IFrame API script once
var ytApiLoaded=false;
function loadYTApi(){
  if(ytApiLoaded) return;
  ytApiLoaded=true;
  var tag=document.createElement('script');
  tag.src='https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}

      videoTimer=setTimeout(closeVideo,210000);
    }
  };

});
