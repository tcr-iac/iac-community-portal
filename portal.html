<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IAC Service Center Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", Arial, sans-serif; background: #f4f6fb; color: #1a1a2e; }

    /* ZONE 1 — NAVBAR */
    #zone-navbar {
      position: sticky; top: 0; z-index: 100;
      background: #004a99;
      display: flex; align-items: center; gap: 1rem;
      padding: 0.7rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    #nav-back-link {
      color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem;
      font-weight: 600; white-space: nowrap;
      transition: color 0.15s;
    }
    #nav-back-link:hover { color: #fff; }
    #nav-portal-label {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: rgba(255,255,255,0.5);
      white-space: nowrap;
    }
    #nav-center-title {
      flex: 1; text-align: center; font-size: 1rem;
      font-weight: 700; color: #fff; letter-spacing: 0.02em;
    }
    #nav-search {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 0.4rem; color: #fff; font-size: 0.85rem;
      font-family: inherit; padding: 0.4rem 0.8rem; outline: none; width: 200px;
    }
    #nav-search::placeholder { color: rgba(255,255,255,0.5); }

    /* ZONE 2 — HEADER */
    #zone-header {
      background: linear-gradient(135deg, #003580 0%, #004a99 60%, #0066cc 100%);
      color: #fff;
      display: flex; align-items: flex-start; gap: 2rem;
      padding: 2rem 2.5rem;
    }
    #header-text { flex: 1; }
    #header-sc-name { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.3rem; }
    #header-tagline2 { font-size: 0.95rem; color: rgba(255,255,255,0.75); margin-bottom: 0.2rem; }
    #header-iac-line { font-size: 0.8rem; color: rgba(255,255,255,0.55); margin-bottom: 1rem; letter-spacing: 0.05em; text-transform: uppercase; }
    #header-vision1, #header-vision2 {
      font-size: 0.88rem; font-style: italic;
      color: rgba(255,255,255,0.72); line-height: 1.6;
      border-left: 3px solid rgba(255,255,255,0.3);
      padding-left: 0.75rem; margin-bottom: 0.5rem;
    }

    /* Video thumbnail */
    #video-thumb-wrapper { flex-shrink: 0; text-align: center; }
    #video-thumb {
      width: 200px; height: 120px;
      background: rgba(0,0,0,0.4);
      border-radius: 0.5rem;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s;
    }
    #video-thumb:hover { border-color: rgba(255,255,255,0.6); }
    #video-poster {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://img.youtube.com/vi/Gdl_vfZPQoQ/hqdefault.jpg') center/cover;
    }
    #video-play-btn {
      position: relative; z-index: 2;
      font-size: 2.5rem; color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    #video-caption { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 0.4rem; }

    /* ZONE 3 — TAGLINE */
    #zone-tagline {
      background: #003580;
      color: rgba(255,255,255,0.85);
      text-align: center;
      padding: 0.6rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    /* ZONE 4 — MENUS */
    #zone-menus { padding: 1.5rem 2.5rem; }
    #menu-button-row {
      display: flex; gap: 0.5rem; margin-bottom: 1rem;
    }
    #menu-button-row button {
      flex: 1; padding: 0.7rem 1rem;
      background: #e8eef8; border: 2px solid #c5d5ee;
      border-radius: 0.5rem; font-family: inherit;
      font-size: 0.9rem; font-weight: 700;
      color: #004a99; cursor: pointer;
      transition: all 0.2s;
    }
    #menu-button-row button:hover { background: #d0dff5; }
    #menu-button-row button[aria-selected="true"] {
      background: #004a99; color: #fff;
      border-color: #004a99;
    }
    #menu-content {
      background: white; border-radius: 0.5rem;
      border: 1px solid #e0e8f5;
      min-height: 200px; padding: 1rem;
    }

    /* ZONE 4.5 — APP DEMOS */
    #zone-app-demos {
      padding: 0.75rem 2.5rem;
      display: flex; align-items: center; gap: 1rem;
      background: #f0f4fc;
      border-top: 1px solid #dde6f5;
    }
    #app-demos-label {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: #666;
    }
    .app-demo-btn {
      background: #004a99; color: white;
      border: none; border-radius: 0.4rem;
      padding: 0.4rem 1rem; font-size: 0.82rem;
      font-family: inherit; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .app-demo-btn:hover { opacity: 0.85; }

    /* ZONE 5 — BOTTOM NAV */
    #zone-bottom-nav {
      background: #003580;
      display: flex; gap: 0.5rem;
      padding: 0.75rem 2.5rem;
    }
    .bottom-nav-btn {
      flex: 1; padding: 0.65rem 0.5rem;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 0.4rem;
      color: #fff; font-family: inherit;
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
      text-align: center;
    }
    .bottom-nav-btn:hover { background: rgba(255,255,255,0.22); }

    /* VIDEO MODAL */
    #video-modal {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 9999;
    }
    #video-modal[hidden] { display: none; }
    #video-modal-backdrop {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
    }
    #video-modal-box {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 80%; max-width: 800px;
    }
    #video-modal-close {
      position: absolute; top: -2rem; right: 0;
      background: none; border: none;
      color: white; font-size: 1.8rem;
      cursor: pointer; line-height: 1;
    }
    #video-player {
      width: 100%; border-radius: 0.5rem;
      display: block;
    }

    /* MENU ITEMS */
    .menu-item { margin-bottom: 2px; }
    .menu-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; cursor: pointer;
      border-radius: 4px; transition: background 0.15s;
    }
    .menu-row:hover { background: #e8f0fe; }
    .menu-arrow { font-size: 10px; color: #004a99; transition: transform 0.2s; }
    .menu-load-btn {
      background: #004a99; color: white;
      border: none; border-radius: 4px;
      padding: 2px 10px; font-size: 11px;
      cursor: pointer; margin-left: auto;
    }
  </style>
</head>
<body>

<!-- ZONE 1 — NAVBAR -->
<nav id="zone-navbar">
  <a href="index.html" id="nav-back-link">← All</a>
  <span id="nav-portal-label">IAC PORTAL</span>
  <span id="nav-center-title">Information Age Community</span>
  <input type="search" id="nav-search" placeholder="Search the portal..." autocomplete="off" />
</nav>

<!-- ZONE 2 — HEADER -->
<header id="zone-header">
  <div id="header-text">
    <h1 id="header-sc-name"></h1>
    <p id="header-tagline2"></p>
    <p id="header-iac-line"></p>
    <p id="header-vision1"></p>
    <p id="header-vision2"></p>
  </div>
  <div id="video-thumb-wrapper">
    <div id="video-thumb" role="button" tabindex="0" aria-label="Play community video">
      <div id="video-poster"></div>
      <div id="video-play-btn">&#9654;</div>
    </div>
    <p id="video-caption">Check us out!</p>
  </div>
</header>

<!-- ZONE 3 — TAGLINE -->
<section id="zone-tagline">
  <span id="tagline-text"></span>
</section>

<!-- ZONE 4 — MENUS -->
<section id="zone-menus">
  <div id="menu-button-row">
    <button id="menu-btn-1" role="tab" aria-selected="false">TeleCenter Services</button>
    <button id="menu-btn-2" role="tab" aria-selected="false">Directory</button>
    <button id="menu-btn-3" role="tab" aria-selected="false">Community Engagement</button>
  </div>
  <div id="menu-content"></div>
</section>

<!-- ZONE 4.5 — APP DEMOS -->
<section id="zone-app-demos">
  <p id="app-demos-label">Application Demonstrations</p>
  <button id="btn-econsensus" class="app-demo-btn">E-Consensus</button>
  <button id="btn-viability" class="app-demo-btn">Viability Index</button>
</section>

<!-- ZONE 5 — BOTTOM NAV -->
<footer id="zone-bottom-nav">
  <button id="btn-contacts" class="bottom-nav-btn">Contacts</button>
  <button id="btn-iac-lens" class="bottom-nav-btn">THE IAC</button>
  <button id="btn-neighborhoods" class="bottom-nav-btn">View our Neighborhoods</button>
  <button id="btn-receptionists" class="bottom-nav-btn">Community Receptionists</button>
</footer>

<!-- VIDEO MODAL -->
<div id="video-modal" hidden>
  <div id="video-modal-backdrop"></div>
  <div id="video-modal-box">
    <button id="video-modal-close">&#x2715;</button>
    <video id="video-player" controls>Your browser does not support the video tag.</video>
  </div>
</div>

<script>
// ── Data ────────────────────────────────────────────────────
const SC_DATA = {
  '102': {
    name: 'Brainerd Service Center',
    tagline2: 'Serving the Brainerd Lakes Region',
    iacLine: 'Information Age Community — Minneapolis · St Paul',
    vision1: '"Technology and tradition, working together for rural Minnesota."',
    vision2: '"Building opportunity for every community in the ecosystem."',
    tagline: 'Connecting Rural Minnesota to the Information Age',
    videoUrl: 'https://www.youtube.com/watch?v=Gdl_vfZPQoQ',
  },
  '101': {
    name: 'Austin Service Center',
    tagline2: 'Serving the Austin–Albert Lea Region',
    iacLine: 'Information Age Community — Minneapolis · St Paul',
    vision1: '"Strengthening Austin as a regional hub for the Information Age."',
    vision2: '"Opportunity for every family in southern Minnesota."',
    tagline: 'Connecting Southern Minnesota to the Information Age',
    videoUrl: 'https://www.youtube.com/watch?v=Gdl_vfZPQoQ',
  }
};

// ── Menus ───────────────────────────────────────────────────
const MENUS = {
  1: [ // TeleCenter Services
    { title: 'Cultural Support', children: [
      { title: 'Arts & Entertainment', children: [] },
      { title: 'Heritage & History', children: [] },
      { title: 'Religious & Spiritual', children: [] },
    ]},
    { title: 'Economic Support', children: [
      { title: 'Business Development', children: [] },
      { title: 'Employment Services', children: [] },
      { title: 'E-Commerce', children: [] },
    ]},
    { title: 'Education Facilities', children: [
      { title: 'K-12 Schools', children: [] },
      { title: 'Higher Education', children: [] },
      { title: 'Vocational Training', children: [] },
    ]},
    { title: 'WVP Deployment', children: [
      { title: 'TeleCommuting', children: [
        { title: 'Deployment Plan', file: 'WVP_Deployment.ppt', children: [] },
      ]},
    ]},
    { title: 'Request Assistance', children: [
      { title: 'Research', children: [
        { title: 'Viability Trends', children: [
          { title: 'Age Curve', file: 'Age_Trend_Dissolve', children: [] },
        ]},
      ]},
    ]},
  ],
  2: [ // Directory
    { title: 'Accommodation & Food Services', children: [
      { title: 'Food Services & Drinking Places', children: [
        { title: 'Full-Service Restaurants', table: true, children: [] },
        { title: 'Limited-Service Restaurants', table: true, children: [] },
      ]},
    ]},
    { title: 'Retail Trade', children: [
      { title: 'General Merchandise Stores', children: [] },
      { title: 'Food & Beverage Stores', children: [] },
    ]},
    { title: 'Health Care & Social Assistance', children: [
      { title: 'Ambulatory Health Care', children: [] },
      { title: 'Hospitals', children: [] },
    ]},
  ],
  3: [ // Community Engagement
    { title: 'Accountability', children: [
      { title: 'Observation Budget', children: [] },
      { title: 'Issues - Community', children: [] },
      { title: 'Legal Framework', file: 'IAC_Legal_Framework.pdf', children: [] },
      { title: 'Public Policy', children: [] },
    ]},
    { title: 'Culture', children: [
      { title: 'Sports', file: 'Sports_Stats', children: [] },
      { title: 'Arts', children: [] },
    ]},
    { title: 'Performance', children: [
      { title: 'Contribution Trends', children: [
        { title: 'Annual Summary', file: 'Contribution_Stats', children: [] },
      ]},
      { title: 'Visioning Tracking', children: [
        { title: 'The IAC', children: [
          { title: 'Annual Summary', file: 'Visioning_Trends', children: [] },
        ]},
      ]},
    ]},
    { title: 'Fellowship', children: [
      { title: 'Announcements', children: [] },
      { title: 'Events', children: [] },
      { title: 'Recognition', children: [] },
    ]},
  ],
};

// ── Render menu items ───────────────────────────────────────
function renderItem(item, depth) {
  const wrap = document.createElement('div');
  wrap.className = 'menu-item';
  wrap.style.paddingLeft = `${depth * 18}px`;

  const row = document.createElement('div');
  row.className = 'menu-row';
  row.style.borderLeft = `3px solid ${depth === 0 ? '#004a99' : depth === 1 ? '#0066cc' : '#aaa'}`;
  row.style.fontWeight = depth === 0 ? '700' : '400';
  row.style.fontSize = `${14 - depth}px`;
  row.style.background = depth === 0 ? '#f0f6ff' : 'white';

  if (item.children && item.children.length > 0) {
    const arrow = document.createElement('span');
    arrow.className = 'menu-arrow';
    arrow.textContent = '▶';
    const label = document.createElement('span');
    label.textContent = item.title;
    row.appendChild(arrow);
    row.appendChild(label);

    const childDiv = document.createElement('div');
    childDiv.style.display = 'none';
    item.children.forEach(c => childDiv.appendChild(renderItem(c, depth + 1)));

    let open = false;
    row.addEventListener('click', () => {
      open = !open;
      arrow.style.transform = open ? 'rotate(90deg)' : '';
      childDiv.style.display = open ? 'block' : 'none';
    });

    wrap.appendChild(row);
    wrap.appendChild(childDiv);
  } else if (item.file) {
    row.innerHTML = `<span>📄</span><span style="flex:1">${item.title}</span>`;
    const btn = document.createElement('button');
    btn.className = 'menu-load-btn';
    btn.textContent = 'Load';
    btn.addEventListener('click', e => { e.stopPropagation(); alert(`Loading: ${item.file}`); });
    row.appendChild(btn);
    wrap.appendChild(row);
  } else if (item.table) {
    row.innerHTML = `<span>📋</span><span>${item.title}</span>`;
    row.addEventListener('click', () => alert(`Loading table for: ${item.title}`));
    wrap.appendChild(row);
  } else {
    row.innerHTML = `<span style="color:#aaa">•</span><span>${item.title}</span>`;
    wrap.appendChild(row);
  }
  return wrap;
}

function loadMenu(idx) {
  const content = document.getElementById('menu-content');
  content.innerHTML = '';
  const items = MENUS[idx] || [];
  items.forEach(item => content.appendChild(renderItem(item, 0)));
}

// ── Init ────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const scid = params.get('scid') || '102';
const zip  = params.get('zip')  || '';
const sc   = SC_DATA[scid] || SC_DATA['102'];

document.getElementById('header-sc-name').textContent  = sc.name;
document.getElementById('header-tagline2').textContent = sc.tagline2;
document.getElementById('header-iac-line').textContent = sc.iacLine;
document.getElementById('header-vision1').textContent  = sc.vision1;
document.getElementById('header-vision2').textContent  = sc.vision2;
document.getElementById('tagline-text').textContent    = sc.tagline;
document.getElementById('nav-center-title').textContent = sc.name;

// Menu tabs
const btn1 = document.getElementById('menu-btn-1');
const btn2 = document.getElementById('menu-btn-2');
const btn3 = document.getElementById('menu-btn-3');
[btn1, btn2, btn3].forEach((btn, i) => {
  btn.addEventListener('click', () => {
    [btn1, btn2, btn3].forEach(b => b.setAttribute('aria-selected', 'false'));
    btn.setAttribute('aria-selected', 'true');
    loadMenu(i + 1);
  });
});
btn1.setAttribute('aria-selected', 'true');
loadMenu(1);

// Video
const thumb = document.getElementById('video-thumb');
const modal  = document.getElementById('video-modal');
const player = document.getElementById('video-player');
thumb.addEventListener('click', () => {
  window.open(sc.videoUrl, '_blank');
});
document.getElementById('video-modal-close').addEventListener('click', () => {
  modal.hidden = true; player.pause(); player.src = '';
});
document.getElementById('video-modal-backdrop').addEventListener('click', () => {
  modal.hidden = true; player.pause(); player.src = '';
});

// Bottom nav
document.getElementById('btn-iac-lens').addEventListener('click', () => { window.location.href = 'index.html'; });
document.getElementById('btn-neighborhoods').addEventListener('click', () => { window.location.href = `profile.html?scid=${scid}&zip=${zip}`; });
document.getElementById('btn-contacts').addEventListener('click', () => { alert('Contacts coming soon!'); });
document.getElementById('btn-receptionists').addEventListener('click', () => { alert('Community Receptionists coming soon!'); });
</script>
</body>
</html>
