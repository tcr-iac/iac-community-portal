<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IAC Neighbourhood Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6fb;
           display: flex; flex-direction: column; overflow: hidden; }

    /* INFO BAR */
    #info-bar {
      background: #003580; color: rgba(255,255,255,0.85);
      padding: 0.6rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
    #sc-label { font-weight: 700; color: #fff; }
    #zip-count { color: rgba(255,255,255,0.6); }
    #info-hint {
      margin-left: auto; font-style: italic;
      color: rgba(255,255,255,0.5); font-size: 0.78rem;
    }

    /* MAP WRAPPER — map + vertical control bar side by side */
    #map-wrapper {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: row;
    }

    /* MAIN MAP */
    #map { flex: 1; min-width: 0; height: 100%; }

    /* COMING SOON STATE */
    #coming-soon {
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      flex: 1;
      text-align: center; padding: 2rem;
    }
    #coming-soon h2 { color: #004a99; font-size: 1.8rem; margin-bottom: 1rem; }
    #coming-soon p  { color: #666; font-size: 1rem; max-width: 400px; line-height: 1.6; }
    #coming-soon .icon { font-size: 3rem; margin-bottom: 1rem; }

    /* CONTROL BAR — full-height vertical bar on the map's right edge,
       green-themed to match the "Community Area" map fill */
    #map-controls-bar {
      width: 190px; flex-shrink: 0; height: 100%;
      background: linear-gradient(180deg, #2e7d4f 0%, #1e5c39 100%);
      color: #fff;
      display: flex; flex-direction: column;
      padding: 16px 14px; gap: 10px;
      overflow-y: auto;
      box-shadow: -2px 0 10px rgba(0,0,0,0.18);
      font-size: 12px;
    }
    #ctrl-title { font-weight: 800; font-size: 13px; line-height: 1.3; }
    #ctrl-zip-count { color: rgba(255,255,255,0.75); margin-top: -4px; }
    .ctrl-legend { display: flex; flex-direction: column; gap: 6px; }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-box {
      width: 14px; height: 14px; border-radius: 3px;
      border: 2px solid rgba(255,255,255,0.4); flex-shrink: 0;
    }
    .ctrl-divider { border-top: 1px solid rgba(255,255,255,0.25); margin: 2px 0; }
    .ctrl-zoom-row { display: flex; gap: 6px; }
    .ctrl-btn {
      flex: 1; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35);
      border-radius: 6px;
      font-size: 16px; font-weight: 700; color: #fff; cursor: pointer; padding: 4px 0;
      line-height: 1.4; font-family: inherit;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.28); }
    .ctrl-btn-wide {
      display: block; width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.35); border-radius: 6px;
      padding: 7px 10px; font-size: 12px; font-weight: 700; color: #fff; cursor: pointer;
      text-align: center; text-decoration: none; font-family: inherit;
    }
    .ctrl-btn-wide:hover { background: rgba(255,255,255,0.28); }
    #ctrl-back-link { margin-top: auto; background: rgba(0,0,0,0.2); }

    /* ADJOINING SC OUTLINE — click navigates straight to that SC's map */
    .adj-outline { cursor: pointer; }

    /* TOWN LABELS */
    .leaflet-tooltip.town-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      font-weight: 700;
      color: #00264d;
      white-space: nowrap;
      pointer-events: none;
      text-shadow:
        -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff,
        -1.5px  1.5px 0 #fff, 1.5px  1.5px 0 #fff,
        -1.5px  0     0 #fff, 1.5px  0     0 #fff,
         0     -1.5px 0 #fff, 0      1.5px 0 #fff;
      transition: font-size 0.15s;
    }
    .town-label::before { display: none; }

    /* ADJOINING SC LABELS */
    .leaflet-tooltip.adj-label {
      background: rgba(0,36,80,0.82) !important;
      border: 1px solid rgba(255,255,255,0.2) !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3) !important;
      border-radius: 5px;
      font-size: 11px; font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      pointer-events: none;
      padding: 3px 9px !important;
    }
    .adj-label::before { display: none; }
  </style>
</head>
<body>

<!-- INFO BAR -->
<div id="info-bar">
  <span id="sc-label">Loading...</span>
  <span id="zip-count"></span>
  <span id="info-hint">Click any community to view its profile · Adjoining centers shown in blue</span>
</div>

<!-- MAP WRAPPER -->
<div id="map-wrapper">
  <div id="map"></div>
  <div id="map-controls-bar">
    <div id="ctrl-title">Loading...</div>
    <div id="ctrl-zip-count"></div>

    <div class="ctrl-legend">
      <div class="legend-row">
        <div class="legend-box" style="background:#2e7d4f;"></div>
        <span>Selected Community</span>
      </div>
      <div class="legend-row">
        <div class="legend-box" style="background:#4a90d9;"></div>
        <span>Community Area</span>
      </div>
      <div class="legend-row">
        <div class="legend-box" style="background:rgba(0,74,153,0.12);border-color:#004a99;"></div>
        <span>Adjoining SC</span>
      </div>
    </div>

    <div class="ctrl-divider"></div>

    <div class="ctrl-zoom-row">
      <button id="ctrl-zoom-in" class="ctrl-btn" title="Zoom in">+</button>
      <button id="ctrl-zoom-out" class="ctrl-btn" title="Zoom out">−</button>
    </div>
    <button id="ctrl-fill-toggle" class="ctrl-btn-wide">Outline View</button>
    <button id="ctrl-basemap-toggle" class="ctrl-btn-wide">Satellite View</button>

    <a id="ctrl-back-link" class="ctrl-btn-wide" href="#">← Back to the Lens</a>
  </div>
</div>

<!-- COMING SOON STATE -->
<div id="coming-soon">
  <div class="icon">🗺️</div>
  <h2>Coming Soon</h2>
  <p>The neighbourhood map for this Service Center is being prepared.</p>
</div>

<script>
// ── Read URL parameters ──────────────────────────────────────
const params      = new URLSearchParams(window.location.search);
const scid        = params.get('scid') || '';
const selectedZip = params.get('zip')  || '';
const viewMode    = params.get('view') === 'neighborhood' ? 'neighborhood' : 'community';

// Lat/lng for every Service Center — mirrors SC_LOCATIONS in iac_map.html,
// used to find nearby SCs for adjacency even when secondary_scid data is sparse.
const SC_COORDS = {"1": {lat: 45.4753, lng: -98.53042}, "2": {lat: 43.66085, lng: -93.3238}, "3": {lat: 45.87047, lng: -95.38985}, "4": {lat: 46.54784, lng: -90.85061}, "5": {lat: 43.6827, lng: -92.99148}, "6": {lat: 47.50985, lng: -94.84921}, "8": {lat: 43.62142, lng: -94.10734}, "9": {lat: 46.32259, lng: -94.11974}, "10": {lat: 44.31588, lng: -96.79518}, "11": {lat: 46.28645, lng: -96.50361}, "13": {lat: 44.94533, lng: -91.39342}, "14": {lat: 47.74189, lng: -96.55522}, "16": {lat: 48.13015, lng: -98.88798}, "17": {lat: 46.83665, lng: -95.82233}, "18": {lat: 41.58448, lng: -93.62152}, "19": {lat: 45.38425, lng: -102.53897}, "21": {lat: 46.75138, lng: -92.5399}, "22": {lat: 44.7432, lng: -91.50899}, "23": {lat: 47.98832, lng: -91.7489}, "24": {lat: 42.49244, lng: -94.18967}, "26": {lat: 44.2973, lng: -93.27414}, "27": {lat: 46.27697, lng: -96.08977}, "28": {lat: 47.86938, lng: -97.14013}, "29": {lat: 47.96201, lng: -90.55792}, "30": {lat: 47.24041, lng: -93.52126}, "31": {lat: 48.78736, lng: -96.99149}, "32": {lat: 46.0251, lng: -91.29494}, "33": {lat: 47.35766, lng: -92.95698}, "34": {lat: 44.97949, lng: -92.69305}, "35": {lat: 44.3948, lng: -98.20037}, "36": {lat: 44.89743, lng: -94.39195}, "37": {lat: 48.53122, lng: -93.13224}, "38": {lat: 46.00748, lng: -94.38032}, "39": {lat: 43.80199, lng: -91.14559}, "40": {lat: 46.88145, lng: -98.76883}, "41": {lat: 44.13193, lng: -93.97789}, "42": {lat: 44.44121, lng: -95.75906}, "44": {lat: 43.15389, lng: -93.20006}, "45": {lat: 44.84971, lng: -91.92994}, "46": {lat: 44.97608, lng: -93.27119}, "48": {lat: 43.71136, lng: -98.04155}, "49": {lat: 45.0064, lng: -95.70098}, "50": {lat: 45.58512, lng: -95.9322}, "51": {lat: 45.11907, lng: -92.52091}, "52": {lat: 44.05966, lng: -93.22639}, "53": {lat: 47.02368, lng: -95.09433}, "55": {lat: 45.83263, lng: -92.90584}, "56": {lat: 44.04936, lng: -96.33361}, "57": {lat: 43.62913, lng: -92.13282}, "58": {lat: 44.51581, lng: -92.5441}, "59": {lat: 44.75599, lng: -94.87624}, "60": {lat: 44.07679, lng: -92.5018}, "61": {lat: 45.72308, lng: -94.97982}, "62": {lat: 42.49413, lng: -96.39361}, "63": {lat: 43.538, lng: -96.69241}, "64": {lat: 45.48718, lng: -94.24307}, "66": {lat: 48.12021, lng: -96.1994}, "68": {lat: 47.25095, lng: -91.66982}, "70": {lat: 47.60027, lng: -92.48261}, "71": {lat: 44.35375, lng: -92.06518}, "72": {lat: 46.46555, lng: -95.14307}, "73": {lat: 48.80879, lng: -95.34167}, "74": {lat: 44.06342, lng: -93.51683}, "75": {lat: 44.93412, lng: -97.09424}, "76": {lat: 45.10181, lng: -95.04226}, "78": {lat: 48.23522, lng: -103.76747}, "79": {lat: 43.88404, lng: -95.13991}, "80": {lat: 43.98469, lng: -91.63143}, "81": {lat: 43.62357, lng: -95.58507}, "92": {lat: 46.9207, lng: -96.83175}};

// ── Load Service Center data ─────────────────────────────────
fetch('service_centers.json').then(r => r.json())
.then(SC_DATA => initMap(SC_DATA))
.catch(err => {
  console.error('Data load error:', err);
  document.getElementById('map-wrapper').style.display = 'none';
  const cs = document.getElementById('coming-soon');
  cs.style.display = 'flex';
  cs.querySelector('h2').textContent  = 'Data Unavailable';
  cs.querySelector('p').textContent   = 'Could not load map data. Please try again.';
});

function initMap(SC_DATA) {
  const sc = SC_DATA[scid];

  // ── No SCID provided ────────────────────────────────────────
  if (!scid) {
    document.getElementById('map-wrapper').style.display = 'none';
    const cs = document.getElementById('coming-soon');
    cs.style.display = 'flex';
    cs.querySelector('.icon').textContent = '📍';
    cs.querySelector('h2').textContent    = 'No Community Selected';
    cs.querySelector('p').textContent     = 'This map opens from a Service Center portal page.';
    return;
  }

  // ── Coming soon — fewer than 2 ZIPs ────────────────────────
  if (!sc || sc.zips.length < 2) {
    document.getElementById('map-wrapper').style.display = 'none';
    const cs = document.getElementById('coming-soon');
    cs.style.display = 'flex';
    if (sc) cs.querySelector('h2').textContent = sc.name + ' — Coming Soon';
    return;
  }

  // ── Update info bar ─────────────────────────────────────────
  const modeLabel = viewMode === 'neighborhood' ? 'Neighborhood Map' : 'Community Map';
  document.getElementById('sc-label').textContent  = sc.name + ' · ' + modeLabel;
  document.getElementById('zip-count').textContent =
    `${sc.zips.length} community area${sc.zips.length !== 1 ? 's' : ''}`;

  // Same href logic the deleted navbar's "← Back to the Lens" link used —
  // now lives as a button inside the legend box.
  const portalUrl = `../portal.html?scid=${scid}&zip=${selectedZip}`;

  // ── Basemap layers ──────────────────────────────────────────
  const streets = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles © Esri', maxZoom: 19 }
  );
  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: 'Tiles © Esri · Maxar', maxZoom: 19 }
  );

  // ── Main map (Map 2) ────────────────────────────────────────
  const map = L.map('map', { zoomControl: false });
  streets.addTo(map);

  // ── Basemap toggle ──────────────────────────────────────────
  let satelliteMode = false;
  function toggleBasemap(btn) {
    satelliteMode = !satelliteMode;
    if (satelliteMode) {
      map.removeLayer(streets);
      satellite.addTo(map);
      btn.textContent = 'Streets View';
    } else {
      map.removeLayer(satellite);
      streets.addTo(map);
      btn.textContent = 'Satellite View';
    }
  }

  // ── Fill/Outline state ───────────────────────────────────────
  let hollowMode = false;
  function toggleOutline(btn) {
    hollowMode = !hollowMode;
    btn.textContent = hollowMode ? 'Filled View' : 'Outline View';
    trackedLayers.forEach(({ layer, isSelected }) => {
      layer.setStyle(styleFor(isSelected, hollowMode));
    });
  }

  // ── Control bar (zoom, outline & basemap controls — identical in both
  // modes) — a static full-height panel docked beside the map rather than a
  // floating Leaflet control, so no click-propagation guarding is needed.
  const scShortName = sc.name.replace(' Service Center', '');
  document.getElementById('ctrl-title').textContent = scShortName + ' — ' + modeLabel;
  document.getElementById('ctrl-zip-count').textContent =
    `${sc.zips.length} community area${sc.zips.length !== 1 ? 's' : ''}`;
  document.getElementById('ctrl-back-link').href = portalUrl;
  document.getElementById('ctrl-zoom-in').addEventListener('click', () => map.zoomIn());
  document.getElementById('ctrl-zoom-out').addEventListener('click', () => map.zoomOut());
  document.getElementById('ctrl-fill-toggle').addEventListener('click', (e) => toggleOutline(e.currentTarget));
  document.getElementById('ctrl-basemap-toggle').addEventListener('click', (e) => toggleBasemap(e.currentTarget));

  // ── Style helpers ───────────────────────────────────────────
  function styleFor(isSelected, hollow) {
    return {
      color:       '#004a99',
      weight:      2.5,
      fillColor:   isSelected ? '#2e7d4f' : '#4a90d9',
      fillOpacity: hollow ? 0 : (isSelected ? 0.45 : 0.25)
    };
  }

  const trackedLayers = [];
  let mainGeoLayer;

  // ── Fetch primary SC ZIP boundaries ─────────────────────────
  const zipList = sc.zips.map(z => `'${z.zip}'`).join(',');
  const apiBase = 'https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer/2/query';
  const apiUrl  = `${apiBase}?where=ZCTA5%20IN%20(${encodeURIComponent(zipList)})&outFields=ZCTA5&f=geojson&outSR=4326`;

  // ── Identify adjoining Service Centers ──────────────────────
  // Data-derived: SCs explicitly listed as a secondary SC for one of our ZIPs.
  const dataAdj = [...new Set(
    sc.zips
      .filter(z => z.secondary_scid)
      .map(z => String(z.secondary_scid))
      .filter(s => s !== scid)
  )];

  // Distance-derived: nearby SCs not already covered by the data above,
  // so towns without secondary_scid coverage still get their real neighbors.
  const here = SC_COORDS[scid];
  let nearAdj = [];
  if (here) {
    nearAdj = Object.entries(SC_COORDS)
      .filter(([id]) => id !== scid && !dataAdj.includes(id))
      .map(([id, c]) => {
        const dLat = c.lat - here.lat;
        const dLng = (c.lng - here.lng) * Math.cos(here.lat * Math.PI / 180);
        return { id, distDeg: Math.sqrt(dLat * dLat + dLng * dLng) };
      })
      .filter(d => d.distDeg <= 1.4)
      .sort((a, b) => a.distDeg - b.distDeg)
      .slice(0, 6)
      .map(d => d.id);
  }

  const adjScids = [...new Set([...dataAdj, ...nearAdj])];

  fetch(apiUrl)
    .then(r => r.json())
    .then(data => {
      if (!data.features?.length) throw new Error('No boundaries');

      mainGeoLayer = L.geoJSON(data, {
        style: feature => {
          const zip = feature.properties.ZCTA5;
          return styleFor(zip === selectedZip, hollowMode);
        },
        onEachFeature: (feature, layer) => {
          const zip      = feature.properties.ZCTA5;
          const zipInfo  = sc.zips.find(z => z.zip === zip);
          const town     = zipInfo?.town     || zip;
          const state    = zipInfo?.state    || '';
          const pop      = zipInfo?.population || 0;
          const landform = zipInfo?.landform || '';
          const isSelected = zip === selectedZip;
          const profileUrl = `../profile.html?zip=${zip}&scid=${scid}`;

          trackedLayers.push({ layer, town, isSelected });

          layer.bindTooltip(town, {
            permanent: true, direction: 'center',
            className: 'town-label', opacity: 0.9
          });

          const popFmt = pop > 0 ? pop.toLocaleString() : 'N/A';
          // Direct click loads profile page immediately
          layer.on('click', () => {
            window.location.href = profileUrl;
          });

          layer.on('mouseover', () => {
            const base = styleFor(isSelected, hollowMode);
            layer.setStyle({ ...base, weight: 3.5,
              fillOpacity: hollowMode ? 0.12 : Math.min(base.fillOpacity + 0.2, 0.7) });
          });
          layer.on('mouseout', () => layer.setStyle(styleFor(isSelected, hollowMode)));
        }
      }).addTo(map);

      if (viewMode === 'neighborhood') {
        map.fitBounds(mainGeoLayer.getBounds(), { padding: [10, 10] });
      } else {
        map.fitBounds(mainGeoLayer.getBounds(), { padding: [40, 40] });
      }
      updateLabelSizes();

      // ── Load adjoining SCs ──────────────────────────────────
      loadAdjoiningServiceCenters(adjScids, SC_DATA, map);
    })
    .catch(err => {
      console.error('Map error:', err);
      document.getElementById('map').innerHTML = `
        <div style="display:flex;flex-direction:column;align-items:center;
          justify-content:center;height:100%;text-align:center;padding:2rem;">
          <div style="font-size:2.5rem;margin-bottom:1rem;">⚠️</div>
          <h3 style="color:#004a99;">Map Temporarily Unavailable</h3>
          <p style="color:#666;max-width:360px;margin-top:8px;">
            Unable to load community boundaries. Please check your connection.
          </p>
        </div>`;
    });

  // ── Label sizing — polygon-relative ────────────────────────
  function updateLabelSizes() {
    trackedLayers.forEach(({ layer, town }) => {
      const b  = layer.getBounds();
      const nw = map.latLngToContainerPoint(b.getNorthWest());
      const se = map.latLngToContainerPoint(b.getSouthEast());
      const wPx = Math.abs(se.x - nw.x);
      const hPx = Math.abs(se.y - nw.y);
      let raw = (wPx * 0.75) / Math.max(town.length * 0.58, 1);
      raw = Math.min(raw, hPx * 0.45);
      const hide = raw < 9;
      const fs   = Math.max(6, Math.min(16, raw));
      const el   = layer.getTooltip()?.getElement();
      if (el) {
        el.style.display   = hide ? 'none' : 'block';
        if (!hide) {
          el.style.fontSize    = fs.toFixed(1) + 'px';
          el.style.maxWidth    = Math.max(wPx * 0.9, 20) + 'px';
          el.style.overflow    = 'hidden';
          el.style.textOverflow = 'ellipsis';
        }
      }
    });
  }
  map.on('zoomend moveend', updateLabelSizes);
  setTimeout(updateLabelSizes, 100);

  // True union of a zip-polygon FeatureCollection into one merged boundary
  // that traces actual zip edges — a convex hull (the old approach) covers
  // territory outside the real zips and overlaps neighboring communities.
  // Falls back to a convex hull if any pairwise union throws (e.g. topology
  // errors in the raw TIGERweb geometry).
  function dissolveFeatures(fc) {
    if (typeof turf === 'undefined') return fc;
    const features = fc.features;
    if (!features.length) return fc;
    let merged = features[0];
    for (let i = 1; i < features.length; i++) {
      try {
        merged = turf.union(merged, features[i]);
      } catch (e) {
        try { return turf.convex(fc); } catch (e2) { return fc; }
      }
    }
    return merged || fc;
  }

  // ── Load adjoining Service Center boundaries ────────────────
  // Each adjoining SC is dissolved into a single outer boundary (no internal
  // ZIP lines) with a permanent centered label — same treatment everywhere,
  // rather than rendering every individual ZIP polygon.
  function loadAdjoiningServiceCenters(adjScids, SC_DATA, map) {
    adjScids.forEach(adjScid => {
      const adjSc = SC_DATA[adjScid];
      if (!adjSc || adjSc.zips.length < 1) return;

      const adjZips = adjSc.zips.map(z => `'${z.zip}'`).join(',');
      const adjUrl  = `${apiBase}?where=ZCTA5%20IN%20(${encodeURIComponent(adjZips)})&outFields=ZCTA5&f=geojson&outSR=4326`;
      const anchorZip = adjSc.zips[0].zip;
      const shortName = adjSc.name.replace(' Service Center', ' SC');
      const mapUrl = `neighborhood-map.html?scid=${adjScid}&zip=${anchorZip}`;

      fetch(adjUrl)
        .then(r => r.json())
        .then(adjData => {
          if (!adjData.features?.length) return;
          const geo = dissolveFeatures(adjData);
          let sublayer = null;
          L.geoJSON(geo, {
            style: {
              color:       '#004a99',
              weight:      1.5,
              fillColor:   '#4a90d9',
              fillOpacity: 0.08,
              dashArray:   '5 4',
              className:   'adj-outline'
            },
            onEachFeature: (feature, layer) => {
              sublayer = layer;
              layer.on('click', () => { window.location.href = mapUrl; });
              layer.bindTooltip(shortName, {
                permanent: true, direction: 'center',
                className: 'adj-label', opacity: 0.9
              });
            }
          }).addTo(map);

          // Leaflet opens a permanent tooltip at the layer's full-shape
          // center (Layer.getCenter()), overwriting any position set before
          // the layer is added to the map. A close, large neighbor's true
          // center can fall outside the current (tightly-fit) view — e.g.
          // Brainerd from Little Falls — leaving the label (the user's only
          // visual click target) off-screen and effectively unreachable. Once
          // added, re-anchor it to the centroid of the part of the shape
          // that's actually visible, overriding Leaflet's default placement.
          if (sublayer && typeof turf !== 'undefined') {
            try {
              const b = map.getBounds();
              const viewBox = turf.bboxPolygon([b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]);
              const clipped = turf.intersect(geo, viewBox);
              if (clipped) {
                const c = turf.centroid(clipped).geometry.coordinates;
                sublayer.getTooltip().setLatLng(L.latLng(c[1], c[0]));
              }
            } catch (e) { /* fall back to Leaflet's default center placement */ }
          }
        })
        .catch(() => {}); // silently skip if API fails for one adjoiner
    });
  }

} // end initMap
</script>
</body>
</html>
